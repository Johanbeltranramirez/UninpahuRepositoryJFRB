<ion-card>
  <ion-card-header class="logtitulo-container">

    <ion-avatar>
      <img [src]="logo" alt="Logo">
    </ion-avatar>


    <ion-card-title>{{ nombreApp }}</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-list>

      <ion-item>
        <ion-label position="floating">Usuario</ion-label>
        <ion-input [(ngModel)]="usuario"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Dirección de entrega</ion-label>
        <ion-input [(ngModel)]="direccion"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">País</ion-label>
        <ion-input [(ngModel)]="pais"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Ciudad</ion-label>
        <ion-input [(ngModel)]="ciudad"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Idioma</ion-label>
        <ion-input [(ngModel)]="idioma"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Moneda</ion-label>
        <ion-input [(ngModel)]="moneda"></ion-input>
      </ion-item>
    </ion-list>


    <ion-button expand="block" color="success" (click)="guardarForm()">
      Guardar
    </ion-button>
  </ion-card-content>
</ion-card>
