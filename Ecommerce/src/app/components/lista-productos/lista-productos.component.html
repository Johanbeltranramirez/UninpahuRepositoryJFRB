<ion-grid>
  <ion-row>
    <ion-col size="12" size-sm="6" size-md="4" size-lg="3" *ngFor="let producto of variableEntradaPadre; let i = index">
      <ion-card>
        <ion-img [src]="producto.image" alt="Imagen de producto"></ion-img>

        <ion-card-header>
          <ion-card-title>{{ producto.title }}</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <p><strong>Materiales:</strong> {{ producto.description }}</p>
          <p><strong>Categoría:</strong> {{ producto.category }}</p>
          <p><strong>Precio:</strong> COL$ {{ producto.price | currency:'COP':'':'1.0-0' }}</p>

          <ion-button *ngIf="!modoCarrito" expand="block" color="success" (click)="comprarProducto(producto)">
            Comprar
          </ion-button>
          <ion-button *ngIf="modoCarrito" expand="block" color="danger" (click)="eliminarProducto(producto.id)">
            Eliminar
          </ion-button>
        </ion-card-content>
      </ion-card>
    </ion-col>
  </ion-row>
</ion-grid>
